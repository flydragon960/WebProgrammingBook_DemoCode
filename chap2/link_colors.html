<!DOCTYPE html>
<!-- link_colors.html   Link colors -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link colors</title>
    <style>
      a:link    { color: #1f4e79; text-decoration: none; }
      a:visited { color: #6b3fa0; text-decoration: none; }
      a:hover   { color: #c0392b; text-decoration: underline; }
      a:active  { color: #e67e22; text-decoration: underline; }
    </style>
  </head>
  <body>
    <h2>Link colors</h2>
    <p>These rules change the colors of a link in each state:</p>
    <p><a href="https://www.concordia.ca" target="_blank">Concordia University</a></p>
  </body>
</html>
