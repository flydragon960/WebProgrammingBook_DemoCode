<!DOCTYPE html>
<!-- organized.html   div, span and section -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>div, span and section</title>
  </head>
  <body>
    <div class="header">
      <h1>Welcome to My Website</h1>
    </div>
    <p>This is a <span style="color: blue;">blue</span> word.</p>
    <section>
      <h2>Chapter 1: Introduction</h2>
      <p>This is the introductory section of the chapter.</p>
    </section>
  </body>
</html>
