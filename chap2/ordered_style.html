<!DOCTYPE html>
<!-- ordered_style.html   Styling an ordered list -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Styling an ordered list</title>
    <style>
      ol { padding-left: 20px; color: blue; }
      li { font-weight: bold; }
    </style>
  </head>
  <body>
    <ol>
      <li>Gold Medal</li>
      <li>Silver Medal</li>
      <li>Bronze Medal</li>
    </ol>
  </body>
</html>
