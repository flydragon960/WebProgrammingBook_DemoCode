<!DOCTYPE html>
<!-- table_sections.html   thead, tbody and tfoot -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>thead, tbody and tfoot</title>
    <style>
      table, th, td { border: 1px solid black; }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr><th>Header 1</th><th>Header 2</th></tr>
      </thead>
      <tbody>
        <tr><td>Data 1</td><td>Data 2</td></tr>
        <tr><td>Data 3</td><td>Data 4</td></tr>
      </tbody>
      <tfoot>
        <tr><td>Summary 1</td><td>Summary 2</td></tr>
      </tfoot>
    </table>
  </body>
</html>
