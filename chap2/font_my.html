<!DOCTYPE html>
<!-- font_my.html   Formatting elements -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formatting elements</title>
  </head>
  <body>
    <p>
      <i>this is italic</i> <br>
      <em>this is em</em> <br>
      <b>this is bold</b> <br>
      <strong>this is strong</strong> <br>
      <code>this is code</code> <br>
      This is normal text. <small>This is smaller text.</small>
    </p>
    <p>Use &lt;mark&gt; to <mark>highlight</mark> a word.</p>
    <p>&lt;del&gt; and &lt;ins&gt;: The lecture is on <del>Monday</del> <ins>Tuesday</ins>.</p>
    <p>&lt;sub&gt; and &lt;sup&gt;: x<sub>2</sub><sup>3</sup> + y<sub>1</sub><sup>2</sup></p>
  </body>
</html>
