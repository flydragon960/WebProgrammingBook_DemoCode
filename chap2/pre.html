<!DOCTYPE html>
<!-- pre.html   Preformatted text -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preformatted text</title>
  </head>
  <body>
    <p>Without pre:
       Mary
          Had a
             little
                lamb
    </p>
    <p>Using pre:</p>
    <pre>
       Mary
          Had a
             little
                lamb
    </pre>
  </body>
</html>
