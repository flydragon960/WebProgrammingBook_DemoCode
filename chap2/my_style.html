<!DOCTYPE html>
<!-- my_style.html   The style attribute -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The style attribute</title>
  </head>
  <body>
    <h1 style="background-color: #dbe7f3;">SOEN 287 Web Programming</h1>
    <p style="color: #1f4e79;">This paragraph is dark blue.</p>
    <h2 style="font-family: Georgia, serif;">A serif heading</h2>
    <p style="font-family: 'Courier New', monospace;">A paragraph in a monospace font.</p>
    <h2 style="text-align: center;">A centered heading</h2>
  </body>
</html>
