<!DOCTYPE html>
<!-- radio.html   Radio buttons -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio buttons</title>
  </head>
  <body>
    <h2>Radio Buttons</h2>
    <p>Choose your payment method</p>
    <form action="submit.php">
      <input type="radio" id="MC" name="pay_method" value="MC">
      <label for="MC">Master Card</label><br>
      <input type="radio" id="VISA" name="pay_method" value="VISA">
      <label for="VISA">VISA Card</label><br>
      <input type="radio" id="gift" name="pay_method" value="gift">
      <label for="gift">A gift card</label><br><br>
      <input type="submit" value="Submit">
    </form>
  </body>
</html>
