<!DOCTYPE html>
<!-- ordered_attributes.html   Ordered list attributes -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordered list attributes</title>
  </head>
  <body>
    <h3>type="A"</h3>
    <ol type="A"> <li>Coffee</li> <li>Sugar</li> <li>Tea</li> </ol>
    <h3>start="50"</h3>
    <ol type="1" start="50"> <li>Coffee</li> <li>Sugar</li> <li>Tea</li> </ol>
    <h3>reversed</h3>
    <ol reversed> <li>Gold Medal</li> <li>Silver Medal</li> <li>Bronze Medal</li> </ol>
  </body>
</html>
