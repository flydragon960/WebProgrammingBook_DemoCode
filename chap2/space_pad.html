<!DOCTYPE html>
<!-- space_pad.html   Spacing and padding -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spacing and padding</title>
    <style>
      table, th, td { border: 1px solid black; }
    </style>
  </head>
  <body>
    <h3>border-spacing: 10px; padding: 30px</h3>
    <table style="border-spacing: 10px;">
      <tr> <td style="padding: 30px;">Cell 1</td> <td style="padding: 30px;">Cell 2</td> </tr>
    </table>
    <h3>border-spacing: 30px; padding: 10px</h3>
    <table style="border-spacing: 30px;">
      <tr> <td style="padding: 10px;">Cell 1</td> <td style="padding: 10px;">Cell 2</td> </tr>
    </table>
  </body>
</html>
