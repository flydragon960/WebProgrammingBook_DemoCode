<!DOCTYPE html>
<!-- video.html   Video (add your own lecture.mp4 / lecture.webm / lecture.vtt in media/) -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video</title>
  </head>
  <body>
    <video width="640" height="360" controls>
      <source src="media/lecture.mp4" type="video/mp4">
      <source src="media/lecture.webm" type="video/webm">
      <track kind="captions" src="media/lecture.vtt" srclang="en" label="English">
      Your browser does not support the video element.
    </video>
  </body>
</html>
