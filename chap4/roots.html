<!DOCTYPE html>
<!-- roots.html   Quadratic roots -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quadratic roots</title>
    <script src="roots.js" defer></script>
  </head>
  <body>
    <h1>Roots of a x² + b x + c</h1>
    <form id="solve">
      <label>a <input id="a" type="number" step="any" value="1" required></label>
      <label>b <input id="b" type="number" step="any" value="-3" required></label>
      <label>c <input id="c" type="number" step="any" value="2" required></label>
      <button>Solve</button>
    </form>
    <pre id="out"></pre>
  </body>
</html>
