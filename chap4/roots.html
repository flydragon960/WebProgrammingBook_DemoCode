<!DOCTYPE html>
<!-- roots.html
     A document for roots.js — output goes into page elements (getElementById),
     input still comes from prompt() windows.
     -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Quadratic Roots</title>
  </head>
  <body>
    <h3>Real roots of a quadratic equation</h3>

    <!-- the two roots will be written into these elements by roots.js -->
    <p id="root1"></p>
    <p id="root2"></p>

    <!-- the script runs AFTER the elements above exist, so getElementById can find them -->
    <script src="roots.js"></script>
  </body>
</html>
