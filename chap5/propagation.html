<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Event Propagation Example</title>
  <style>
    body * {
      margin: 10px;
      border: 1px solid blue;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div onclick="alert('Outer DIV Clicked!')">Outer DIV
    <div onclick="alert('Inner DIV Clicked!')">Inner DIV
      <p onclick="alert('Paragraph Clicked!')">Paragraph</p>
    </div>
  </div>
</body>
</html>
