<!DOCTYPE html>
<!-- load.html   Page load events -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page load events</title>
  </head>
  <body>
    <p id="out">Loading...</p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("out").textContent = "The HTML is parsed (DOMContentLoaded).";
      });
      window.addEventListener("load", () => {
        console.log("Everything, including images, has loaded (load).");
      });
    </script>
  </body>
</html>
