<!DOCTYPE html>
<!-- validator.html   Form validation -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form validation</title>
  </head>
  <body>
    <form id="register" novalidate>
      <p><label for="name">Name (Last, First):</label>
         <input id="name" name="name" required></p>
      <p><label for="phone">Phone:</label>
         <input id="phone" name="phone" placeholder="514-555-0123" required></p>
      <button>Register</button>
    </form>
    <p id="errors" aria-live="polite"></p>
    <script>
      const namePattern = /^[A-Za-z' -]+, [A-Za-z' -]+$/;
      const phonePattern = /^\d{3}-\d{3}-\d{4}$/;
      function check(field, pattern, message) {
        const ok = pattern.test(field.value.trim());
        field.setCustomValidity(ok ? "" : message);   // uses the browser's validation UI
        return ok;
      }
      const form = document.getElementById("register");
      form.name.addEventListener("change", () => check(form.name, namePattern, "Use the form Last, First"));
      form.phone.addEventListener("change", () => check(form.phone, phonePattern, "Use the form 514-555-0123"));
      form.addEventListener("submit", event => {
        const ok = check(form.name, namePattern, "Use the form Last, First") &
                   check(form.phone, phonePattern, "Use the form 514-555-0123");
        if (!ok) {
          event.preventDefault();
          form.reportValidity();
        } else {
          event.preventDefault();  // demo only: no server
          document.getElementById("errors").textContent = "Thank you, " + form.name.value + ".";
        }
      });
    </script>
  </body>
</html>
