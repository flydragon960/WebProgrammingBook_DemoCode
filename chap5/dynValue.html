<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dynamic content</title>
  <style>
    #helpBox { width: 360px; min-height: 40px; padding: 8px;
               border: 1px solid #999; background: #fffde7; }
    p { margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Dynamic content</h1>
  <form>
    <p><label>Name: <input type="text" id="name"></label></p>
    <p><label>Phone: <input type="text" id="phone"></label></p>
  </form>
  <div id="helpBox">Click in a field to see help.</div>

  <script>
    const helpers = ["Your name must be: first name, initial, last name",
                     "Your phone number must be 514-848-2424"];

    function showHelp(index) {
      document.getElementById("helpBox").textContent = helpers[index];
    }

    document.getElementById("name")
      .addEventListener("focus", function () { showHelp(0); });
    document.getElementById("phone")
      .addEventListener("focus", function () { showHelp(1); });
  </script>
</body>
</html>
