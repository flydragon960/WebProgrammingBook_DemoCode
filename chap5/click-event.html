<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The click event</title>
  <style>
    #box { width: 160px; padding: 20px; background: #ddebf2; }
  </style>
</head>
<body>
  <h1>The 'click' event</h1>
  <button id="myButton">A button</button>
  <p><a id="myLink" href="#">A link</a></p>
  <div id="box">A div (any element can be clicked)</div>

  <script>
    document.getElementById("myButton")
      .addEventListener("click", function () {
        alert("Button was clicked!");
      });

    document.getElementById("myLink")
      .addEventListener("click", function (event) {
        event.preventDefault();          // do not follow the link
        alert("Link was clicked!");
      });

    document.getElementById("box")
      .addEventListener("click", function () {
        alert("Div was clicked!");
      });
  </script>
</body>
</html>
