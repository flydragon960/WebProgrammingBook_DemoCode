<!DOCTYPE html>
<!-- stacking.html   z-index -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>z-index</title>
    <style>
      .card {position: absolute; width: 140px; height: 100px; padding: 8px; border: 1px solid #333; cursor: pointer;}
    </style>
  </head>
  <body>
    <p>Click a card to bring it to the front.</p>
    <div class="card" style="left: 20px; top: 60px; background: #f9cc9d;">Lab</div>
    <div class="card" style="left: 80px; top: 100px; background: #c3d08b;">Quiz</div>
    <div class="card" style="left: 140px; top: 140px; background: #9cc9ff;">Exam</div>
    <script>
      let highest = 1;
      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => card.style.zIndex = ++highest);
      });
    </script>
  </body>
</html>
