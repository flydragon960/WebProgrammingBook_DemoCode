<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>getElementsByClassName</title></head>
<body>
  <h1 class="myClass">Head</h1>
  <p class="myClass">para 1</p>
  <p class="myClass">para 2</p>
  <button onclick="run()">Make every .myClass bigger</button>
  <script>
    function run() {
      // One class can be on many elements, so this returns a collection, never one element.
      const elements = document.getElementsByClassName("myClass");
      for (let i = 0; i < elements.length; i++) {
        elements[i].style.fontSize = "24px";
      }
    }
  </script>
</body>
</html>
