<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Using the event object</title>
  <style>
    button { font-size: 18px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Using the event object</h1>
  <button id="btn">Change my colour</button>
  <p id="info"></p>

  <script>
    function bgChange(event) {
      const rnd = n => Math.floor(Math.random() * n);
      const colour = `rgb(${rnd(255)} ${rnd(255)} ${rnd(255)})`;
      event.target.style.backgroundColor = colour;

      document.getElementById("info").textContent =
        `event.type = ${event.type}, event.clientX = ${event.clientX}, ` +
        `colour = ${colour}`;
    }

    const btn = document.getElementById("btn");
    btn.addEventListener("click", bgChange);
  </script>
</body>
</html>
