<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toggle Visibility</title>
  <style>
    #toggleElement, #toggleElement2 {
      width: 100px;
      height: 100px;
      background-color: green;
      color: white;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Toggling visibility</h1>

  <h2>With style.display</h2>
  <div id="toggleElement">Hello!</div>
  <button id="toggleButton">Toggle Visibility</button>

  <h2>With a class (simpler)</h2>
  <div id="toggleElement2">Hello!</div>
  <button id="toggleButton2">Toggle Visibility</button>

  <script>
    document.getElementById("toggleButton")
      .addEventListener("click", function () {
        const el = document.getElementById("toggleElement");
        if (el.style.display === "none") {
          el.style.display = "block";
        } else {
          el.style.display = "none";
        }
      });

    // simpler, with a .hidden { display: none; } rule
    document.getElementById("toggleButton2")
      .addEventListener("click", function () {
        const el = document.getElementById("toggleElement2");
        el.classList.toggle("hidden");
      });
  </script>
</body>
</html>
