<!DOCTYPE html>
<!-- password_check.html   Password confirmation -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password confirmation</title>
  </head>
  <body>
    <form id="pw">
      <p><label for="first">Password:</label> <input type="password" id="first" required minlength="8"></p>
      <p><label for="second">Repeat:</label> <input type="password" id="second" required></p>
      <button>Save</button>
    </form>
    <p id="out" aria-live="polite"></p>
    <script>
      document.getElementById("pw").addEventListener("submit", event => {
        event.preventDefault();
        const first = document.getElementById("first").value;
        const second = document.getElementById("second").value;
        document.getElementById("out").textContent =
          first === second ? "Passwords match." : "The two passwords are different.";
      });
    </script>
  </body>
</html>
