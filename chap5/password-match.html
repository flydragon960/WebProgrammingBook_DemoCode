<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Constraint Validation API</title>
  <style>
    input:invalid { border: 2px solid #c00000; }
    p { margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Better messages: the Constraint Validation API</h1>
  <form id="signup">
    <p><label for="password">Password:</label>
       <input type="password" id="password" required minlength="8"></p>
    <p><label for="confirm">Password again:</label>
       <input type="password" id="confirm" required></p>
    <button type="submit">Create account</button>
  </form>
  <p id="result"></p>

  <script>
    const pwd = document.getElementById("password");
    const again = document.getElementById("confirm");

    again.addEventListener("input", function () {
      if (again.value !== pwd.value) {
        again.setCustomValidity("The two passwords differ.");
      } else {
        again.setCustomValidity("");
      }
    });

    // The browser blocks submission while setCustomValidity holds a message.
    document.getElementById("signup").addEventListener("submit", function (event) {
      event.preventDefault();   // demo only
      document.getElementById("result").textContent = "Passwords match: form accepted.";
    });
  </script>
</body>
</html>
