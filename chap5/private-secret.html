<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private variables and methods</title>
  <style>
    #log { font: 15px monospace; background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>
  <h1>Private variables and methods</h1>
  <p>
    <input id="newSecret" value="New Secret">
    <button id="set">holder.setSecret(...)</button>
    <button id="get">holder.getSecret()</button>
    <button id="direct">holder.secret</button>
  </p>
  <pre id="log"></pre>

  <script>
    function createSecretHolder(secret) {
      return {
        getSecret: function () { return secret; },
        setSecret: function (value) { secret = value; }
      };
    }

    const holder = createSecretHolder("Initial Secret");

    const log = document.getElementById("log");
    function write(code, value) {
      log.textContent += code + "  →  " + JSON.stringify(value) + "\n";
    }

    document.getElementById("set").addEventListener("click", function () {
      const value = document.getElementById("newSecret").value;
      holder.setSecret(value);
      write('holder.setSecret("' + value + '")', "done");
    });
    document.getElementById("get").addEventListener("click", function () {
      write("holder.getSecret()", holder.getSecret());
    });
    document.getElementById("direct").addEventListener("click", function () {
      write("holder.secret", holder.secret);    // undefined: it is private
    });
  </script>
</body>
</html>
