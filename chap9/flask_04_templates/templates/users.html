<!-- templates/users.html : a stand-alone page (no inheritance yet) -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Users</title></head>
<body>
    {% if users %}
        <ul>
        {% for user in users %}
            <li><a href="{{ url_for('user_profile', username=user) }}">
                {{ user }}
            </a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No users found.</p>
    {% endif %}
</body>
</html>
