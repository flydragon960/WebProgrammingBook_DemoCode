<!DOCTYPE html>
<!-- float-clear.html   clear -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>clear</title>
    <style>
      .side {float: right; width: 120px; padding: 10px; border: 3px solid #1a7f37;}
      .text {padding: 10px; border: 3px solid #b00020;}
      .cleared {clear: right;}
      h2 {clear: both;}
    </style>
  </head>
  <body>
    <h2>Without clear</h2>
    <div class="side">Floated box</div>
    <div class="text">This box comes after the floated box in the HTML, so its text flows around it.</div>
    <h2>With clear: right</h2>
    <div class="side">Floated box</div>
    <div class="text cleared">clear: right moves this box below the floated box.</div>
  </body>
</html>
