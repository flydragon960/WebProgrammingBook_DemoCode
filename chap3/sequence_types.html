<!DOCTYPE html>
<!-- sequence_types.html   Nested ordered lists -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nested ordered lists</title>
    <style>
      ol       {list-style-type: upper-roman;}
      ol ol    {list-style-type: upper-alpha;}
      ol ol ol {list-style-type: decimal;}
    </style>
  </head>
  <body>
    <h3>Course outline</h3>
    <ol>
      <li>Front end
        <ol>
          <li>HTML
            <ol><li>Text and links</li><li>Forms</li></ol>
          </li>
          <li>CSS
            <ol><li>Selectors</li><li>Layout</li></ol>
          </li>
        </ol>
      </li>
      <li>Back end
        <ol>
          <li>Node.js
            <ol><li>Express</li><li>Databases</li></ol>
          </li>
        </ol>
      </li>
    </ol>
  </body>
</html>
