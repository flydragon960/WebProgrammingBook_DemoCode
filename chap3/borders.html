<!DOCTYPE html>
<!-- borders.html   Borders -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Borders</title>
    <style>
      table {
        border: 1px solid black;
        border-top: medium dotted red;
        border-bottom: thick dashed blue;
      }
      th, td {border: 1px solid black; padding: 4px 10px;}
      p.note {border: thin dashed green; width: 50%; padding: 8px;}
    </style>
  </head>
  <body>
    <table>
      <caption>Lab schedule</caption>
      <tr><th>Lab</th><th>Topic</th><th>Due</th></tr>
      <tr><td>1</td><td>HTML</td><td>Week 2</td></tr>
      <tr><td>2</td><td>CSS</td><td>Week 4</td></tr>
    </table>
    <p class="note">A paragraph with a thin dashed green border.</p>
  </body>
</html>
