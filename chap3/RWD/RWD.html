<!DOCTYPE html>
<!-- RWD.html   Desktop, tablet and phone layouts (figures 3.11.1 to 3.11.3) -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive course page</title>
    <style>
      * {box-sizing: border-box;}
      body {margin: 0; font-family: Arial, Helvetica, sans-serif; color: #222;}
      header {background: #1f4e79; color: #fff; padding: 14px 20px; font-size: 1.4rem; font-weight: bold;}
      .page {display: grid; gap: 16px; padding: 16px;}
      nav {background: #dbe7f3; padding: 10px;}
      nav ul {list-style: none; margin: 0; padding: 0;}
      nav li {padding: 6px 0;}
      main {border: 1px solid #ccc; padding: 12px;}
      .cards {display: grid; gap: 12px;}
      .card {background: #f4f4f4; border: 1px solid #ddd; padding: 10px; min-height: 70px;}
      footer {background: #eee; padding: 10px 20px;}
      /* tablet */
      @media (min-width: 600px) {
        .page {grid-template-columns: repeat(12, 1fr);}
        nav {grid-column: span 3;}
        main {grid-column: span 9;}
        .cards {grid-template-columns: repeat(2, 1fr);}
      }
      /* desktop */
      @media (min-width: 1000px) {
        .cards {grid-template-columns: repeat(3, 1fr);}
      }
    </style>
  </head>
  <body>
    <header>SOEN 287 Web Programming</header>
    <div class="page">
      <nav><ul><li>Syllabus</li><li>Schedule</li><li>Labs</li><li>Grades</li></ul></nav>
      <main>
        <h1>Week 3: CSS</h1>
        <p>This week we style the pages we wrote in Chapter 2.</p>
        <div class="cards">
          <div class="card">Lecture notes</div>
          <div class="card">Lab 3</div>
          <div class="card">Quiz 1</div>
        </div>
      </main>
    </div>
    <footer>Concordia University</footer>
  </body>
</html>
