<!DOCTYPE html>
<!-- GridView.html   Grid example from Chapter 3 (figure 3.111.3) -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A 12-column grid</title>
    <style>
      .page {display: grid; gap: 16px;}
      /* Tablets and desktops: 12 columns */
      @media (min-width: 600px) {
        .page {grid-template-columns: repeat(12, 1fr);}
        .menu    {grid-column: span 3;}
        .content {grid-column: span 9;}
      }
      .menu {background: #f9cc9d;}
      .content {background: #c3d08b;}
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="menu">
        <ul>
          <li>Syllabus</li>
          <li>Schedule</li>
          <li>Labs</li>
          <li>Grades</li>
        </ul>
      </nav>
      <main class="content">
        <h1>Week 3: CSS</h1>
        <p>This week we style the pages we wrote in Chapter 2.</p>
        <p>Make the browser window narrower to see the menu move above the content.</p>
      </main>
    </div>
  </body>
</html>
