<!DOCTYPE html>
<!-- Flex-menu-bootstrap.html   The same menu, built with Bootstrap 5 -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A horizontal menu (Bootstrap)</title>
    <!-- 1) Bootstrap's CSS — provides all the .navbar / .nav-link styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-3">
    <h1>A horizontal menu (Bootstrap)</h1>

    <!-- navbar-expand-sm: links in a row on >= small screens, hamburger below -->
    <nav class="navbar navbar-expand-sm navbar-dark" style="background-color:#1f4e79;">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Course Portal</a>

        <!-- the hamburger button (Bootstrap shows it automatically on small screens) -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- the links: navbar-nav is already display:flex -->
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">News</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <p>Same &lt;ul&gt;&lt;li&gt;&lt;a&gt; menu — Bootstrap's classes do the Flexbox, and its JavaScript runs the hamburger.</p>

    <!-- 2) Bootstrap's JS — REQUIRED for the hamburger toggle to work -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
