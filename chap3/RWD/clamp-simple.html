<!DOCTYPE html>
<!-- clamp-simple.html   clamp(): see WHICH value is being used -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clamp() demo</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; }
    /* clamp(MIN, PREFERRED, MAX) = 24px ... 4vw ... 64px
       MIN (red)  below  600px   (4vw = 24px at 600px)
       MAX (blue) above 1600px   (4vw = 64px at 1600px)
       fluid (green) in between                                   */
    #demo {
      font-size: clamp(1.5rem, 4vw, 4rem);
      padding: 40px 20px; text-align: center; color: #fff; font-weight: bold;
      transition: background-color .15s;
    }
    #info { text-align: center; font-size: 1rem; padding: 14px; color: #333; }
    #info b { font-size: 1.1rem; }
    .key { text-align:center; color:#666; font-size:.9rem; }
    .key span { display:inline-block; padding:2px 10px; border-radius:6px; color:#fff; margin:0 4px; }
  </style>
</head>
<body>
  <div id="demo">Resize me</div>
  <p id="info"></p>
  <p class="key">
    <span style="background:#c0392b">MIN</span> narrow (&lt;600px) &nbsp;
    <span style="background:#1e8449">PREFERRED</span> scaling &nbsp;
    <span style="background:#2471a3">MAX</span> wide (&gt;1600px)
  </p>

  <script>
    const demo = document.getElementById('demo');
    const info = document.getElementById('info');

    function update() {
      const root = parseFloat(getComputedStyle(document.documentElement).fontSize); // 1rem in px
      const min  = 1.5 * root, max = 4 * root;                 // 24px and 64px
      const now  = parseFloat(getComputedStyle(demo).fontSize); // current font size

      let zone, color;
      if (now <= min + 0.5)      { zone = 'MIN (1.5rem floor)';      color = '#c0392b'; }  // red
      else if (now >= max - 0.5) { zone = 'MAX (4rem ceiling)';      color = '#2471a3'; }  // blue
      else                       { zone = 'PREFERRED (4vw, fluid)';  color = '#1e8449'; }  // green

      demo.style.backgroundColor = color;
      info.innerHTML = 'window: <b>' + window.innerWidth + 'px</b> &nbsp;·&nbsp; '
                     + 'font-size: <b>' + Math.round(now) + 'px</b> &nbsp;·&nbsp; '
                     + 'using <b>' + zone + '</b>';
    }
    addEventListener('resize', update);
    addEventListener('load', update);
    update();
  </script>
</body>
</html>
