<!DOCTYPE html>
<!-- WithViewport.html   With the viewport tag -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>With the viewport tag</title>
    <style>
      img {max-width: 100%; height: auto;}
    </style>
  </head>
  <body>
    <h1>With the viewport tag</h1>
    <p>This line is written as one long sentence so that you can see how the text wraps.
    Open the page on a phone: without the viewport tag the phone shows a shrunken desktop
    page and you have to zoom in to read it; with the tag the text is readable immediately.</p>
    <img src="../images/campus.svg" alt="Drawing of campus buildings" width="1000">
  </body>
</html>
