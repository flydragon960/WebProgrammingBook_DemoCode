<!DOCTYPE html>
<!-- Flex-menu.html   A horizontal menu with flexbox -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A horizontal menu</title>
    <style>
      .menu {list-style: none; margin: 0; padding: 10px;
             display: flex; gap: 10px; background-color: #1f4e79;}
      .menu a {display: block; padding: 10px 18px; background-color: #f4f4f4;
               text-decoration: none; color: #1f4e79; font-size: 1.2rem;}
      .menu a:hover {background-color: #f4a81d; color: #fff;}
    </style>
  </head>
  <body>
    <h1>A horizontal menu</h1>
    <nav>
      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
    <p>display: flex on the &lt;ul&gt; lays the &lt;li&gt; items in a row — the modern replacement for float.</p>
  </body>
</html>
