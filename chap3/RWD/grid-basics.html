<!DOCTYPE html>
<!-- grid-basics.html   Grid basics: 3 equal columns -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid basics</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);  /* 3 equal columns */
        gap: 16px;                               /* row + column space */
        background: #1f4e79; padding: 16px;
      }
      .container > div {
        background: #f4f4f4; padding: 20px; text-align: center; font-size: 1.3rem;
      }
      .wide { grid-column: span 3; }   /* this item spans all 3 columns */
    </style>
  </head>
  <body>
    <h1>Grid: rows and columns</h1>
    <div class="container">
      <div class="wide">Header (spans 3 columns)</div>
      <div>Box 1</div>
      <div>Box 2</div>
      <div>Box 3</div>
    </div>
    <p>grid-template-columns defines the columns; grid-column: span N makes an item wider.</p>
  </body>
</html>
