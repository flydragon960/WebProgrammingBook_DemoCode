<!DOCTYPE html>
<!-- MediaQuery.html   A media query -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A media query</title>
    <style>
      body {background-color: #9ef99e;}
      @media (max-width: 600px) {
        body {background-color: #649acf;}
      }
    </style>
  </head>
  <body>
    <p>Make the window narrower than 600 pixels: the background changes from light
    green to light blue.</p>
  </body>
</html>
