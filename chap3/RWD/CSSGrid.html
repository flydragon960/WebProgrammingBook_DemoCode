<!DOCTYPE html>
<!-- CSSGrid.html   Grid template areas -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid template areas</title>
    <style>
      .page {
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        grid-template-areas:
          "header header header"
          "menu   main   aside"
          "footer footer footer";
        gap: 10px;
      }
      header {grid-area: header;}
      nav    {grid-area: menu;}
      main   {grid-area: main;}
      aside  {grid-area: aside;}
      footer {grid-area: footer;}
      .page > * {background: #dbe7f3; padding: 16px; text-align: center;}
    </style>
  </head>
  <body>
    <h1>Grid template areas</h1>
    <div class="page">
      <header>Header</header>
      <nav>Menu</nav>
      <main>Main content</main>
      <aside>Announcements</aside>
      <footer>Footer</footer>
    </div>
  </body>
</html>
