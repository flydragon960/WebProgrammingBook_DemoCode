<!DOCTYPE html>
<!-- selector_id.html   id selector -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>id selector</title>
    <style>
      #week3 {color: #b00020; text-align: center;}
    </style>
  </head>
  <body>
    <h2 id="week3">Week 3: CSS</h2>
    <h2>Week 4: JavaScript</h2>
    <p>Only the heading whose id is week3 is styled.</p>
  </body>
</html>
