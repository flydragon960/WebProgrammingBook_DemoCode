<!DOCTYPE html>
<!-- selector_child.html   Child selector (>) -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Child selector (>)</title>
    <style>
      article > p {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <h1>Child selector (>): <code>article > p</code></h1>
    <article>
      <h2>Week 3: CSS</h2>
      <p>Read the notes before class.</p>
      <section>
        <p>Lab: style your home page.</p>
      </section>
      <p>Quiz on Friday.</p>
    </article>
    <p>Office hours: Tuesday, 2 pm.</p>
    <p>Room: EV 3.309.</p>
  </body>
</html>
