<!DOCTYPE html>
<!-- image-center.html   Centering an image -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centering an image</title>
    <style>
      img.centered {
        display: block;   /* an image is inline by default */
        margin: 0 auto;   /* equal left and right margins */
        max-width: 50%;
      }
    </style>
  </head>
  <body>
    <h2>A centered image</h2>
    <img class="centered" src="images/campus.svg" alt="Drawing of campus buildings">
  </body>
</html>
