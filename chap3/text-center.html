<!DOCTYPE html>
<!-- text-center.html   Centering a block -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centering a block</title>
    <style>
      .box {width: 60%; margin: 0 auto; border: 3px solid #1f4e79; padding: 10px;}
    </style>
  </head>
  <body>
    <h2>Center a block element</h2>
    <div class="box"><p>A box 60% wide, centered with margin: auto.</p></div>
  </body>
</html>
