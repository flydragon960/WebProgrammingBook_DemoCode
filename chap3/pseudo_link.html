<!DOCTYPE html>
<!-- pseudo_link.html   Link pseudo-classes -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link pseudo-classes</title>
    <style>
      a:link    {color: #1f4e79;}  /* not visited yet */
      a:visited {color: #6b3fa0;}  /* visited */
      a:hover   {color: #b00020;}  /* mouse over */
      a:active  {color: #e67e22;}  /* being clicked */
    </style>
  </head>
  <body>
    <p><a href="https://www.concordia.ca">Concordia University</a></p>
    <p><a href="https://developer.mozilla.org">MDN Web Docs</a></p>
  </body>
</html>
