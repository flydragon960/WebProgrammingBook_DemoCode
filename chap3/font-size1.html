<!DOCTYPE html>
<!-- font-size1.html   Relative font sizes -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relative font sizes</title>
    <style>
      html  {font-size: 100%;}    /* = 16px by default */
      h1    {font-size: 2rem;}
      small {font-size: 0.875em;}
    </style>
  </head>
  <body>
    <h1>Heading 1: 2rem</h1>
    <p>Paragraph text uses the root size (1rem).</p>
    <p><small>Small text: 0.875em of its parent.</small></p>
    <p>Change the browser's default font size in its settings: every size above follows.</p>
  </body>
</html>
