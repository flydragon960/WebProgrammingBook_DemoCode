<!DOCTYPE html>
<!-- border-style-color.html   border color per side -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>border color per side</title>
    <style>
      p.card {
        border-style: solid;
        border-width: 6px;
        border-top-color: #1f4e79;
        border-right-color: #1a7f37;
        border-bottom-color: #b00020;
        border-left-color: #e67e22;
        padding: 12px;
        width: 60%;
      }
    </style>
  </head>
  <body>
    <p class="card">Each side of this box has its own color.</p>
  </body>
</html>
