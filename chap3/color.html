<!DOCTYPE html>
<!-- color.html   Ways to write a color -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ways to write a color</title>
    <style>
      .name {color: darkblue;}
      .hex {color: #1f4e79;}
      .rgb {color: rgb(31, 78, 121);}
      .rgba {color: rgba(31, 78, 121, 0.5);}
      .hsl {color: hsl(208, 59%, 30%);}
    </style>
  </head>
  <body>
    <p class="name">Named color: darkblue</p>
    <p class="hex">Hexadecimal: #1f4e79</p>
    <p class="rgb">RGB: rgb(31, 78, 121)</p>
    <p class="rgba">RGBA: rgba(31, 78, 121, 0.5)</p>
    <p class="hsl">HSL: hsl(208, 59%, 30%)</p>
  </body>
</html>
