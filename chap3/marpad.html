<!DOCTYPE html>
<!-- marpad.html   Margin and padding -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Margin and padding</title>
    <style>
      p {background-color: #dbe7f3; border: 1px solid #1f4e79;}
      p.one {margin: 20px; padding: 20px;}
      p.two {margin: 10px; padding: 30px;}
      p.three {margin: 30px; padding: 10px;}
      p.four {margin: 40px; padding: 0;}
      p.five {margin: 0; padding: 40px;}
    </style>
  </head>
  <body>
    <p>A paragraph with the default margin and no padding.</p>
    <p class="one">margin: 20px; padding: 20px</p>
    <p class="two">margin: 10px; padding: 30px</p>
    <p class="three">margin: 30px; padding: 10px</p>
    <p class="four">margin: 40px; padding: 0</p>
    <p class="five">margin: 0; padding: 40px</p>
  </body>
</html>
