<!DOCTYPE html>
<!-- selector_class.html   Class selector with a tag name -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class selector with a tag name</title>
    <style>
      p.note {color: #1f4e79;}
      p.warning {color: #b00020; font-weight: bold;}
    </style>
  </head>
  <body>
    <p class="note">Bring your laptop to the lab.</p>
    <p class="warning">Lab 3 is due on Friday.</p>
    <h3 class="warning">This h3 is not affected: the rule is p.warning.</h3>
  </body>
</html>
