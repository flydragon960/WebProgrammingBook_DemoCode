<!DOCTYPE html>
<!-- textshadow.html   Text shadow -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text shadow</title>
    <style>
      .simple {text-shadow: 2px 2px 2px darkgray;}
      .glow {color: white; background: #1f4e79; text-shadow: 0 0 10px #9cc9ff; padding: 8px;}
    </style>
  </head>
  <body>
    <h1 class="simple">Simple shadow</h1>
    <h1 class="glow">Glow</h1>
  </body>
</html>
