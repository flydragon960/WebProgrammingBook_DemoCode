<!DOCTYPE html>
<!-- style_first_example.html   External style sheet plus one inline style -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Levels of CSS</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Welcome to <em>SOEN 287</em></h1>
    <p>This page takes its colors from <code>styles.css</code> (external style sheet).</p>
    <p style="color: gray;">This paragraph has an inline style, which wins over the style sheet.</p>
  </body>
</html>
