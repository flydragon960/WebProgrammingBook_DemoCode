<!DOCTYPE html>
<!-- font-size2.html   Viewport units -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewport units</title>
    <style>
      h1 {font-size: 8vw;}
    </style>
  </head>
  <body>
    <h1>This heading is 8vw</h1>
    <p>Make the window narrower or wider: the heading changes size with it,
       because 1vw is 1% of the viewport width.</p>
  </body>
</html>
