<!DOCTYPE html>
<!-- text-indent.html   text-indent -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>text-indent</title>
    <style>
      p {text-indent: 2em; max-width: 40em;}
    </style>
  </head>
  <body>
    <p>The first line of each paragraph starts 2em from the left edge, as in a printed book.
    Indentation is set in em so that it grows with the font size.</p>
    <p>A second paragraph shows that every paragraph gets the same indentation.</p>
  </body>
</html>
