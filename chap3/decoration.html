<!DOCTYPE html>
<!-- decoration.html   Text decoration -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text decoration</title>
    <style>
      nav a {text-decoration-line: none;}
      .old-price {text-decoration-line: line-through; text-decoration-color: red;}
      .misspelled {text-decoration: underline wavy red;}
      h2 {text-decoration: underline 3px;}
    </style>
  </head>
  <body>
    <nav><a href="syllabus.html">Syllabus</a> | <a href="labs.html">Labs</a></nav>
    <p>Textbook: <span class="old-price">$95</span> $60</p>
    <p>Spelling: <span class="misspelled">recieve</span></p>
    <h2>A heading with a thick underline</h2>
  </body>
</html>
