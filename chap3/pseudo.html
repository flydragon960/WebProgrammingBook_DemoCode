<!DOCTYPE html>
<!-- pseudo.html   Pseudo-classes :hover and :focus -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pseudo-classes :hover and :focus</title>
    <style>
      input:hover {background-color: #fff3b0;}
      input:focus {outline: 3px solid #1f4e79;}
    </style>
  </head>
  <body>
    <form action="submit.php">
      <label for="name">Your name:</label>
      <input type="text" id="name" name="name">
    </form>
    <p>Move the mouse over the field, then click in it.</p>
  </body>
</html>
