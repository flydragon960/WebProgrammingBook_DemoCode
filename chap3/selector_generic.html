<!DOCTYPE html>
<!-- selector_generic.html   Class selector without a tag name -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class selector without a tag name</title>
    <style>
      .deadline {color: #b00020;}
    </style>
  </head>
  <body>
    <h2 class="deadline">Lab 3 due Friday</h2>
    <p class="deadline">Late labs lose 10% per day.</p>
    <p>This paragraph has no class.</p>
  </body>
</html>
