<!DOCTYPE html>
<!-- bullet.html   list-style-type -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>list-style-type</title>
  </head>
  <body>
    <h3>Course topics</h3>
    <ul style="list-style-type: square;">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
    <h3>Course topics</h3>
    <ul>
      <li style="list-style-type: disc;">HTML</li>
      <li style="list-style-type: square;">CSS</li>
      <li style="list-style-type: circle;">JavaScript</li>
    </ul>
  </body>
</html>
