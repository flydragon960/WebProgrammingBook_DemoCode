<!DOCTYPE html>
<!-- back_image.html   Background image -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Background image</title>
    <style>
      body {
        background-color: #ffffff;
        background-image: url('images/pattern.svg');
        background-repeat: repeat-y;
        background-position: center;
      }
      p {max-width: 30em; margin: 40px auto; padding: 16px; background: rgba(255, 255, 255, 0.9);}
    </style>
  </head>
  <body>
    <p>The page background repeats a small SVG pattern vertically in the centre.
    Background images are decoration only: important pictures belong in an img element
    with alt text.</p>
  </body>
</html>
