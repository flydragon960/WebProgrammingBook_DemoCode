<!DOCTYPE html>
<!-- span_div.html   span and div -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>span and div</title>
    <style>
      .highlight {background-color: #fff3b0; font-weight: bold;}
      .notice {border: 1px solid #1f4e79; padding: 8px;}
    </style>
  </head>
  <body>
    <p>The lab is due <span class="highlight">Friday at 11:59 pm</span>.</p>
    <div class="notice">
      <p>Lab 3 is due on Friday.</p>
      <p>Submit it on Moodle.</p>
    </div>
  </body>
</html>
