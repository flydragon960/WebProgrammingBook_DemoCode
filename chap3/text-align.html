<!DOCTYPE html>
<!-- text-align.html   text-align -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>text-align</title>
    <style>
      h1 {text-align: center;}
      h2 {text-align: left;}
      h3 {text-align: right;}
      .justified {width: 240px; border: 1px solid black; padding: 10px; text-align: justify;}
    </style>
  </head>
  <body>
    <h1>Centered title</h1>
    <h2>Left-aligned subtitle</h2>
    <h3>Right-aligned note</h3>
    <p class="justified">Montreal's Old Port stretches along the St. Lawrence River for more than
    two kilometres. Once a busy harbour, it is now a public space with walking paths, museums
    and a science centre, and it is one of the most visited places in the city.</p>
  </body>
</html>
