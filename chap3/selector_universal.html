<!DOCTYPE html>
<!-- selector_universal.html   Universal selector -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Universal selector</title>
    <style>
      * {font-family: Arial, Helvetica, sans-serif;}
    </style>
  </head>
  <body>
    <h1>Course news</h1>
    <p>Every element on this page uses the same font.</p>
    <ul><li>Lecture notes</li><li>Lab 3</li></ul>
  </body>
</html>
