<!DOCTYPE html>
<!-- text-valign.html   Vertical centering -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vertical centering</title>
    <style>
      .stage {
        display: flex;          /* modern way: flexbox */
        justify-content: center;
        align-items: center;
        height: 300px;
        border: 1px dashed #999;
      }
    </style>
  </head>
  <body>
    <div class="stage"><p>Centered horizontally and vertically</p></div>
  </body>
</html>
